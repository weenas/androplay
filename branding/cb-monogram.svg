<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="CastBay CB logo with two boats in a rippled bay">
  <!-- The open C reads as both a harbor enclosure and a wireless signal arc. -->
  <path d="M99 27C84 16 65 14 48 20 29 27 18 44 18 64c0 20 12 39 31 47 19 8 39 7 53-1"
        fill="none" stroke="#6750A4" stroke-width="12" stroke-linecap="round"/>
  <!-- The two pointed bowls of the B suggest boats entering the harbor. -->
  <path d="M60 29h16c12 0 20 5 24 14-4 9-12 14-24 14H60z M69 37v12h7c7 0 12-2 15-6-3-4-8-6-15-6z"
        fill="#C7B8FF" fill-rule="evenodd"/>
  <path d="M60 56h17c13 0 22 5 26 14-4 9-13 14-26 14H60z M69 64v12h8c8 0 14-2 17-6-3-4-9-6-17-6z"
        fill="#C7B8FF" fill-rule="evenodd"/>
  <!-- Two quiet ripples make the bay legible without competing with CB. -->
  <path d="M39 93c10-5 18-5 28 0s18 5 28 0"
        fill="none" stroke="#9D85E8" stroke-width="4" stroke-linecap="round"/>
  <path d="M47 101c8-3 15-3 23 0s15 3 23 0"
        fill="none" stroke="#9D85E8" stroke-width="2.5" stroke-linecap="round"/>
</svg>
